spring.application.name=dms-backend
server.port=8081

spring.config.import=optional:file:.env[.properties]

# Database connection (use environment variables for security)
spring.datasource.url=${DB_URL:jdbc:postgresql://pg-23fe8501-anujawij-8f00.l.aivencloud.com:16850/DMS?sslmode=require}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Multipart limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Document edit lock: a lock older than this is treated as abandoned and can be
# taken over. Lower it (e.g. to 1) to demonstrate automatic release quickly.
app.document.lock.timeout-minutes=15

# Key used to encrypt stored credentials (ERP API keys) with AES-GCM.
# Supplied from .env like the other secrets; the fallback is development-only.
app.crypto.secret=${CRYPTO_SECRET:dms-development-key-change-me}

# OCR language data. Leave blank to auto-detect the usual install locations on
# Windows, macOS (Intel and Apple Silicon) and Linux. Set it only if Tesseract
# is installed somewhere unusual.
#   Windows : choco install tesseract   -> C:\Program Files\Tesseract-OCR\tessdata
#   macOS   : brew install tesseract    -> /opt/homebrew/share/tessdata
#   Linux   : apt install tesseract-ocr -> /usr/share/tesseract-ocr/5/tessdata
app.ocr.tessdata-path=

# Frontend URL for share links
app.frontend.url=http://localhost:3000

# Upload directory (can be relative or absolute)



app.upload.dir=uploads
# Optional: max bytes (fallback 100MB)
app.upload.max-bytes=104857600

# Storage backend: local or s3
app.storage.type=s3
app.frontend.url=http://localhost:3000

# S3 configuration
app.s3.bucket=universal-dms-bucket
app.s3.region=ap-south-1
app.s3.access-key=${AWS_ACCESS_KEY:}
app.s3.secret-key=${AWS_SECRET_KEY:}

# HikariCP connection pool (Spring Boot auto-configures Hikari as the DataSource)
#
# Sizing note: the shared Aiven instance allows 20 connections in total for the
# whole team, so this pool has to stay small. It must not be 1, though - it was,
# and that made the application serialise every request that touches the
# database. Because spring.jpa.open-in-view is on, a request holds its
# connection until the response is fully written, including the time spent
# streaming a file to or from S3. With a single connection, any second request
# arriving during an upload, a preview or a signature stamp simply waited, and
# after connection-timeout it failed with "Could not open JPA EntityManager".
# That is what made document pages and edit mode fail intermittently.
#
# Three per developer leaves room for five backends plus a little headroom, and
# idle connections are handed straight back so an idle teammate's instance does
# not sit on the budget.
spring.datasource.hikari.pool-name=DMSHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
# Fail in a few seconds with a clear error rather than freezing the page for 30.
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
# Logs a stack trace when a connection is held far longer than any request
# should need, so a future leak is attributable instead of mysterious.
spring.datasource.hikari.leak-detection-threshold=20000

# Multipart upload configuration
app.upload.multipart-threshold=104857600
app.upload.chunk-size=10485760

# Increase thread pool for concurrent uploads
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=200
server.tomcat.max-http-form-post-size=50MB

# Email configuration for password reset
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:cyberxdms@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Increase request timeout for large uploads
server.servlet.session.timeout=30m
spring.mvc.async.request-timeout=300000

# S3 timeout
aws.sdk.client.request-timeout=120000
