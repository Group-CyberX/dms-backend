spring.application.name=dms-backend
server.port=8081

# Database connection (use environment variables for security)
spring.datasource.url=${DB_URL:jdbc:postgresql://pg-23fe8501-anujawij-8f00.l.aivencloud.com:16850/DMS?sslmode=require}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Upload directory (can be relative or absolute)
app.upload.dir=uploads
# Optional: max bytes (fallback 100MB)
app.upload.max-bytes=104857600

# Storage backend: local or s3
app.storage.type=s3

# S3 configuration
app.s3.bucket=universal-dms-bucket
app.s3.region=ap-south-1
app.s3.access-key=
app.s3.secret-key=

# Frontend base URL
app.frontend.url=http://localhost:3000

# HikariCP connection pool (Spring Boot auto-configures Hikari as the DataSource)
spring.datasource.hikari.pool-name=DMSHikariPool
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1 